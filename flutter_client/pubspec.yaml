name: chhakri
description: Bundelkhandi Chhakri — multiplayer card game
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

# ---------------------------------------------------------------------------
# Dependencies
# Phase 0: listed and planned — install when Flutter client is implemented.
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # HTTP
  dio: ^5.4.3+1

  # WebSocket / Socket.IO
  socket_io_client: ^2.0.3+1

  # Local storage
  hive_flutter: ^1.1.0

  # Code generation utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.20.2
  collection: ^1.18.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.10
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.7.3
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/cards/
    - assets/animations/
    - assets/audio/
    - assets/fonts/

  # Font files (TiroDevanagari, Inter) are not yet bundled in this repository.
  # Declare them here once the .ttf binaries are placed in assets/fonts/.
  # Until then, keep this section empty to avoid flutter build failures.
  # fonts:
